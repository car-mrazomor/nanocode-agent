<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="color-scheme" content="dark">
<title>nanocode</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root {
  --bg: #0a0a0a; --panel: #141414; --panel2: #1e1e1e; --border: #484848; --line: #262626;
  --text: #eeeeee; --muted: #808080; --faint: #606060;
  --accent: #7fa7c9; --accent2: #9d8fc4; --cyan: #78b8c4; --success: #7fd88f; --error: #e06c75; --warning: #e5c07b;
  --mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.55 var(--mono); display: flex; overflow: hidden; }
button { font: inherit; color: inherit; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px;
  padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--border); }
button.primary { background: var(--accent); color: #0a0a0a; border-color: var(--accent); }
button.danger { background: transparent; color: var(--error); border-color: var(--error); }
button:disabled { opacity: .45; cursor: default; }
a { color: var(--accent); }

#side { width: 270px; flex: none; background: var(--panel); border-right: 1px solid var(--line); display: flex;
  flex-direction: column; }
#side header { padding: 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.logo { font-weight: 700; letter-spacing: .5px; }
.logo span { color: var(--accent2); }
#sessions { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
.session { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 6px;
  padding: 8px 10px; margin: 1px 0; }
.session:hover { background: var(--panel2); }
.session.active { background: var(--panel2); box-shadow: inset 2px 0 0 var(--accent); }
.session .t { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.session .m { display: block; color: var(--faint); font-size: 12px; }
#side footer { padding: 10px 16px; border-top: 1px solid var(--line); color: var(--faint); font-size: 12px;
  display: flex; justify-content: space-between; gap: 8px; }
#side footer button { padding: 2px 8px; font-size: 12px; }

main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#top { display: none; padding: 10px 16px; border-bottom: 1px solid var(--line); align-items: center; gap: 10px; }
#chat { flex: 1; overflow-y: auto; padding: 24px max(16px, calc((100% - 860px) / 2)); }
#empty { color: var(--muted); margin-top: 18vh; text-align: center; }
#empty .big { font-size: 28px; color: var(--text); font-weight: 700; margin-bottom: 8px; }
.msg { margin: 0 0 18px; }
.user { background: var(--panel); border-left: 2px solid var(--accent); padding: 10px 14px; white-space: pre-wrap;
  word-wrap: break-word; }
.reply { padding: 0 2px; word-wrap: break-word; }
.reply p { margin: 0 0 10px; }
.reply h1, .reply h2, .reply h3, .reply h4 { margin: 14px 0 8px; font-size: 15px; color: var(--accent); }
.reply ul, .reply ol { margin: 0 0 10px; padding-left: 22px; }
.reply code { background: var(--panel2); padding: 1px 5px; border-radius: 4px; color: var(--cyan); }
.reply pre { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px;
  overflow-x: auto; margin: 0 0 10px; }
.reply pre code { background: none; padding: 0; color: var(--text); }
.reply blockquote { margin: 0 0 10px; padding-left: 12px; border-left: 2px solid var(--border); color: var(--muted); }
.reply table { border-collapse: collapse; margin: 0 0 10px; display: block; overflow-x: auto; }
.reply td, .reply th { border: 1px solid var(--line); padding: 4px 8px; }
details.tool { margin: 0 0 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
details.tool summary { padding: 6px 10px; cursor: pointer; color: var(--muted); list-style: none; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
details.tool summary::-webkit-details-marker { display: none; }
details.tool summary b { color: var(--accent2); font-weight: 400; }
details.tool summary .st { margin-right: 6px; }
details.tool.err summary .st { color: var(--error); }
details.tool.ok summary .st { color: var(--success); }
details.tool pre { margin: 0; padding: 8px 10px; border-top: 1px solid var(--line); max-height: 320px; overflow: auto;
  white-space: pre-wrap; word-wrap: break-word; color: var(--muted); font-size: 12.5px; }
.meta { color: var(--faint); font-size: 12px; margin: -6px 0 18px; }
.meta .mark { color: var(--accent2); }
.error { color: var(--error); }
.screen { white-space: pre-wrap; color: var(--muted); }

#composer { padding: 12px max(16px, calc((100% - 860px) / 2)) max(16px, env(safe-area-inset-bottom)); }
#box { background: var(--panel); border: 1px solid var(--line); border-left: 2px solid var(--accent); border-radius: 4px;
  display: flex; flex-direction: column; }
#box:focus-within { border-color: var(--border); border-left-color: var(--accent); }
#input { background: transparent; color: var(--text); border: 0; outline: 0; resize: none; font: inherit; padding: 12px 14px;
  min-height: 48px; max-height: 40vh; }
#bar { display: flex; justify-content: space-between; align-items: center; padding: 0 10px 10px 14px; gap: 8px; }
#status { color: var(--faint); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#status .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent2);
  margin-right: 6px; animation: pulse 1s infinite alternate; }
@keyframes pulse { from { opacity: .3; } to { opacity: 1; } }

#login { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: none; align-items: center;
  justify-content: center; padding: 16px; z-index: 10; }
#login form { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 22px;
  width: 100%; max-width: 440px; }
#login input { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
  padding: 9px 10px; font: inherit; margin: 12px 0; }
#login p { color: var(--muted); margin: 6px 0 0; font-size: 13px; }

@media (max-width: 760px) {
  #side { position: fixed; inset: 0 auto 0 0; z-index: 5; transform: translateX(-100%); transition: transform .15s;
    width: 82vw; max-width: 320px; }
  body.menu #side { transform: none; box-shadow: 0 0 40px #000; }
  #top { display: flex; }
  #chat { padding: 16px; }
  #composer { padding-left: 16px; padding-right: 16px; }
}
</style>
</head>
<body>
<aside id="side">
  <header><div class="logo">nano<span>code</span></div><button id="new" title="New chat (Ctrl+Shift+O)">+ New</button></header>
  <div id="sessions"></div>
  <footer><span id="model"></span><button id="logout" title="Forget the API key in this browser">key</button></footer>
</aside>
<main>
  <div id="top"><button id="menu" aria-label="Chats">☰</button><div class="logo">nano<span>code</span></div></div>
  <div id="chat"><div id="empty"><div class="big">nanocode</div>Ask anything about this project.<br>
    Edits and commands run on the machine running <code>nanocode serve</code>.</div></div>
  <div id="composer">
    <div id="box">
      <textarea id="input" rows="1" placeholder="Message nanocode…  (Enter sends, Shift+Enter new line)"></textarea>
      <div id="bar"><span id="status"></span><span><button id="stop" class="danger" hidden>Stop</button>
        <button id="send" class="primary">Send</button></span></div>
    </div>
  </div>
</main>
<div id="login"><form id="loginForm">
  <b>Connect to nanocode</b>
  <p>Paste the API key that <code>nanocode serve</code> printed (or from <code>~/.nanocode/config.json</code>, under
    "api"). It's kept in this browser only.</p>
  <input id="key" type="password" autocomplete="off" placeholder="API key" required>
  <button class="primary" type="submit">Connect</button> <span id="loginError" class="error"></span>
</form></div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} },
};
const state = { key: null, session: null, run: null, busy: false, sessions: [] };

// --- API ---
async function api(method, path, body) {
  const res = await fetch(path, { method, headers: { "Authorization": "Bearer " + state.key,
    "Content-Type": "application/json" }, body: body === undefined ? undefined : JSON.stringify(body) });
  if (res.status === 401) { askKey("That key didn't work."); throw new Error("unauthorized"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error((data.error && data.error.message) || res.statusText);
  return data;
}

// Server-sent events over fetch (EventSource can't send the Authorization header).
async function events(path, onEvent) {
  const res = await fetch(path, { headers: { "Authorization": "Bearer " + state.key } });
  if (!res.ok || !res.body) throw new Error("can't follow the run (" + res.status + ")");
  const reader = res.body.getReader(), decoder = new TextDecoder();
  let buffer = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    let cut;
    while ((cut = buffer.indexOf("\n\n")) >= 0) {
      const block = buffer.slice(0, cut); buffer = buffer.slice(cut + 2);
      const data = block.split("\n").filter((l) => l.startsWith("data: ")).map((l) => l.slice(6)).join("\n");
      if (data) { try { onEvent(JSON.parse(data)); } catch (e) { console.error(e); } }
    }
  }
}

// --- Markdown (small, safe: everything is escaped first) ---
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function inline(s) {
  const codes = [];
  s = s.replace(/`([^`\n]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
  s = esc(s)
    .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^\w*])\*([^*\n]+)\*(?=[^\w*]|$)/g, "$1<i>$2</i>")
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => "<code>" + esc(codes[+i]) + "</code>");
}
function markdown(src) {
  const lines = src.replace(/\r/g, "").split("\n"), out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    const fence = line.match(/^\s*(```|~~~)\s*([\w+-]*)/);
    if (fence) {
      const body = []; i++;
      while (i < lines.length && !lines[i].trim().startsWith(fence[1])) body.push(lines[i++]);
      i++;
      out.push("<pre><code>" + esc(body.join("\n")) + "</code></pre>");
      continue;
    }
    const h = line.match(/^(#{1,4})\s+(.*)/);
    if (h) { out.push("<h" + h[1].length + ">" + inline(h[2]) + "</h" + h[1].length + ">"); i++; continue; }
    if (/^\s*([-*+]|\d+[.)])\s+/.test(line)) {
      const ordered = /^\s*\d/.test(line), items = [];
      while (i < lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i]))
        items.push("<li>" + inline(lines[i++].replace(/^\s*([-*+]|\d+[.)])\s+/, "")) + "</li>");
      out.push((ordered ? "<ol>" : "<ul>") + items.join("") + (ordered ? "</ol>" : "</ul>"));
      continue;
    }
    if (/^\s*\|.*\|\s*$/.test(line)) {
      const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(lines[i++]);
      out.push("<table>" + rows.filter((r) => !/^\s*\|[\s:|-]+\|\s*$/.test(r)).map((r, n) => "<tr>" +
        r.trim().slice(1, -1).split("|").map((c) => (n ? "<td>" : "<th>") + inline(c.trim()) + (n ? "</td>" : "</th>")).join("")
        + "</tr>").join("") + "</table>");
      continue;
    }
    if (/^>\s?/.test(line)) {
      const q = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) q.push(lines[i++].replace(/^>\s?/, ""));
      out.push("<blockquote>" + inline(q.join(" ")) + "</blockquote>");
      continue;
    }
    if (!line.trim()) { i++; continue; }
    const para = [];
    while (i < lines.length && lines[i].trim() && !/^\s*(```|~~~|#{1,4}\s|[-*+]\s|\d+[.)]\s|>|\|)/.test(lines[i])) para.push(lines[i++]);
    if (!para.length) para.push(lines[i++]);
    out.push("<p>" + para.map(inline).join("<br>") + "</p>");
  }
  return out.join("");
}

// --- Rendering ---
const chat = $("chat");
function stick() { return chat.scrollHeight - chat.scrollTop - chat.clientHeight < 80; }
function bottom() { chat.scrollTop = chat.scrollHeight; }
function clearChat() { chat.innerHTML = ""; }
function add(cls, html) {
  $("empty") && $("empty").remove();
  const el = document.createElement("div");
  el.className = "msg " + cls; el.innerHTML = html; chat.appendChild(el); return el;
}
function userMsg(text) { const el = add("user", ""); el.textContent = text; return el; }
function toolEl(name, args) {
  $("empty") && $("empty").remove();
  const d = document.createElement("details");
  d.className = "tool";
  const preview = args && typeof args === "object" ? (args.path || args.command || args.pattern || args.query ||
    args.url || args.name || "") : "";
  d.innerHTML = '<summary><span class="st">⚙</span><b>' + esc(name) + "</b> " + esc(String(preview).slice(0, 140)) +
    "</summary><pre>" + esc(JSON.stringify(args || {}, null, 1)) + "</pre>";
  chat.appendChild(d);
  return d;
}
function toolDone(d, output, isError) {
  d.classList.add(isError ? "err" : "ok");
  d.querySelector(".st").textContent = isError ? "✗" : "✓";
  const pre = document.createElement("pre");
  pre.textContent = output || "";
  d.appendChild(pre);
}
function fmtTokens(n) { return n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + "k" : String(n); }
function status(text, busy) { $("status").innerHTML = (busy ? '<span class="dot"></span>' : "") + esc(text || ""); }

// --- Sessions ---
async function loadSessions() {
  try {
    const data = await api("GET", "/v1/sessions");
    state.sessions = data.data || [];
  } catch (e) { return; }
  const list = $("sessions");
  list.innerHTML = "";
  for (const s of state.sessions) {
    const b = document.createElement("button");
    b.className = "session" + (s.id === state.session ? " active" : "");
    b.innerHTML = '<span class="t"></span><span class="m"></span>';
    b.querySelector(".t").textContent = s.title || "untitled";
    b.querySelector(".m").textContent = ago(s.updated) + (s.model ? " · " + s.model : "");
    b.onclick = () => { openSession(s.id); document.body.classList.remove("menu"); };
    list.appendChild(b);
  }
}
function ago(ts) {
  const s = Date.now() / 1000 - (ts || 0);
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return Math.floor(s / 86400) + "d ago";
}
async function openSession(id) {
  if (state.busy) return;
  let data;
  try { data = await api("GET", "/v1/sessions/" + encodeURIComponent(id)); } catch (e) { status(e.message); return; }
  state.session = id;
  store.set("nanocode.session", id);
  clearChat();
  const tools = {};
  for (const t of data.turns || []) {
    if (t.role === "user") userMsg(t.text);
    else if (t.role === "assistant") add("reply", markdown(t.text));
    else if (t.role === "tool") tools[t.id] = toolEl(t.name, t.arguments);
    else if (t.role === "tool_result" && tools[t.id]) toolDone(tools[t.id], t.text, t.is_error);
    else if (t.role === "screen") { const el = add("screen", ""); el.textContent = t.text; }
  }
  bottom();
  status(data.title || "");
  loadSessions();
}
function newChat() {
  if (state.busy) return;
  state.session = null;
  store.set("nanocode.session", null);
  chat.innerHTML = '<div id="empty"><div class="big">New chat</div>Ask anything about this project.</div>';
  status("");
  loadSessions();
  $("input").focus();
}

// --- Sending ---
async function send() {
  const input = $("input"), text = input.value.trim();
  if (!text || state.busy) return;
  input.value = ""; resize();
  userMsg(text); bottom();
  setBusy(true);
  status("thinking…", true);
  let reply = null, source = "";
  const runTools = {};
  try {
    const started = await api("POST", "/v1/runs", { input: text, session_id: state.session || undefined });
    state.run = started.run_id;
    await events("/v1/runs/" + started.run_id + "/events", (ev) => {
      const follow = stick();
      if (ev.event === "run.started") {
        state.session = ev.session_id; store.set("nanocode.session", ev.session_id);
        if (ev.model) $("model").textContent = ev.model;
      } else if (ev.event === "delta") {
        if (!reply) { reply = add("reply", ""); source = ""; }
        source += ev.text; reply.innerHTML = markdown(source);
        status("writing…", true);
      } else if (ev.event === "text_end") {
        reply = null;
      } else if (ev.event === "tool.started") {
        reply = null;
        runTools[ev.id] = toolEl(ev.name, ev.arguments);
        status(ev.name + "…", true);
      } else if (ev.event === "tool.completed") {
        if (runTools[ev.id]) toolDone(runTools[ev.id], ev.output, ev.is_error);
        status("thinking…", true);
      } else if (ev.event === "run.completed" || ev.event === "run.failed" || ev.event === "run.cancelled") {
        const u = ev.usage || {};
        const parts = [];
        if (ev.event === "run.cancelled") parts.push("stopped");
        if (u.input_tokens) parts.push(fmtTokens(u.input_tokens) + " in · " + fmtTokens(u.output_tokens) + " out");
        if (u.cost) parts.push("$" + u.cost.toFixed(4));
        if (parts.length) add("meta", '<span class="mark">▣</span> ' + esc(parts.join(" · ")));
        if (ev.error) add("error", esc("⏺ " + ev.error));
      }
      if (follow) bottom();
    });
  } catch (e) {
    if (e.message !== "unauthorized") add("error", esc("⏺ " + e.message));
  } finally {
    state.run = null;
    setBusy(false);
    status("");
    bottom();
    loadSessions();
  }
}
async function stop() {
  if (!state.run) return;
  status("stopping…", true);
  try { await api("POST", "/v1/runs/" + state.run + "/stop", {}); } catch (e) {}
}
function setBusy(b) {
  state.busy = b; $("send").disabled = b; $("stop").hidden = !b; $("new").disabled = b;
}
function resize() { const i = $("input"); i.style.height = "auto"; i.style.height = Math.min(i.scrollHeight, innerHeight * 0.4) + "px"; }

// --- Key ---
function askKey(message) {
  $("login").style.display = "flex";
  $("loginError").textContent = message || "";
  $("key").focus();
}
async function connect(key) {
  state.key = key;
  try {
    const caps = await api("GET", "/v1/capabilities");
    store.set("nanocode.key", key);
    $("login").style.display = "none";
    $("model").textContent = caps.backend_model || "";
    await loadSessions();
    const last = store.get("nanocode.session");
    if (last && state.sessions.some((s) => s.id === last)) await openSession(last);
    $("input").focus();
  } catch (e) {
    if (e.message !== "unauthorized") askKey("Can't reach nanocode: " + e.message);
  }
}

$("loginForm").onsubmit = (e) => { e.preventDefault(); connect($("key").value.trim()); };
$("send").onclick = send;
$("stop").onclick = stop;
$("new").onclick = newChat;
$("menu").onclick = () => document.body.classList.toggle("menu");
$("logout").onclick = () => { store.set("nanocode.key", null); askKey(""); };
$("input").addEventListener("input", resize);
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  if (e.key === "Escape" && state.busy) stop();
});
document.addEventListener("keydown", (e) => { if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "o") { e.preventDefault(); newChat(); } });
chat.addEventListener("click", () => document.body.classList.remove("menu"));

// `nanocode web` opens this page with the key in the address's #fragment (never sent to the server).
const fromHash = new URLSearchParams(location.hash.slice(1)).get("key");
if (fromHash) history.replaceState(null, "", location.pathname);
const saved = fromHash || store.get("nanocode.key");
if (saved) connect(saved); else askKey("");
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
