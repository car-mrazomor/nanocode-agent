<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="color-scheme" content="dark">
<title>nanocode</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root {
  --bg: #0a0a0a; --panel: #141414; --panel2: #1e1e1e; --border: #484848; --line: #262626;
  --text: #eeeeee; --muted: #808080; --faint: #606060;
  --accent: #7fa7c9; --accent2: #9d8fc4; --cyan: #78b8c4; --success: #7fd88f; --error: #e06c75; --warning: #e5c07b;
  --mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.55 var(--mono); display: flex; overflow: hidden; }
button { font: inherit; color: inherit; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px;
  padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--border); }
button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
button.danger { background: transparent; color: var(--error); border-color: var(--error); }
button.ghost { background: none; border-color: transparent; }
button.ghost:hover { background: var(--panel2); border-color: var(--line); }
button:disabled { opacity: .45; cursor: default; }
input, select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
  padding: 6px 10px; outline: 0; }
input:focus, select:focus { border-color: var(--border); }
a { color: var(--accent); }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8;
  stroke-linecap: round; stroke-linejoin: round; }

/* --- sidebar --- */
#side { width: 264px; flex: none; background: var(--panel); border-right: 1px solid var(--line); display: flex;
  flex-direction: column; min-height: 0; }
#side header { padding: 14px 14px 10px; display: flex; align-items: center; justify-content: space-between; }
.logo { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 15px; color: var(--text); }
.logo svg { width: 26px; height: 26px; flex: none; }
#nav { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
.nav { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0;
  border-radius: 6px; padding: 6px 10px; margin: 1px 0; color: var(--text); }
.nav svg.i { color: var(--accent); }
.nav:hover { background: var(--panel2); }
.nav.active { background: var(--panel2); box-shadow: inset 2px 0 0 var(--accent); }
.nav .grow { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav .tail { color: var(--faint); font-size: 12px; }
.nav .chev { color: var(--faint); transition: transform .15s; }
.nav.open .chev { transform: rotate(90deg); }
.group { padding-left: 14px; }
.group[hidden] { display: none; }
.session { position: relative; display: block; width: 100%; text-align: left; background: none; border: 0;
  border-radius: 6px; padding: 6px 30px 6px 10px; margin: 1px 0; }
.session:hover { background: var(--panel2); }
.session.active { background: var(--panel2); box-shadow: inset 2px 0 0 var(--accent); }
.session .t { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.session .m { display: block; color: var(--faint); font-size: 12px; }
.session .more { position: absolute; right: 4px; top: 6px; padding: 0 6px; background: none; border: 0;
  color: var(--faint); visibility: hidden; }
.session:hover .more, .session.active .more { visibility: visible; }
.session .more:hover { color: var(--text); }
.empty-note { color: var(--faint); font-size: 12px; padding: 4px 10px; }
#side footer { padding: 10px 14px; border-top: 1px solid var(--line); color: var(--faint); font-size: 12px;
  display: flex; justify-content: space-between; align-items: center; gap: 8px; }
#side footer .where { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#side footer button { padding: 2px 8px; font-size: 12px; }

/* --- main --- */
main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
#top { padding: 8px 16px; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 42px; }
#top .menu { display: none; position: absolute; left: 12px; top: 6px; }
#titleBtn { background: none; border: 0; color: var(--muted); font-size: 13px; display: flex; align-items: center;
  gap: 6px; max-width: 60vw; }
#titleBtn:hover { color: var(--text); }
#titleBtn .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#chat { flex: 1; overflow-y: auto; padding: 8px max(16px, calc((100% - 860px) / 2)) 24px; }
#hero { margin-top: 20vh; text-align: center; color: var(--muted); }
#hero .big { font-size: 30px; font-weight: 600; color: var(--text); display: flex; align-items: center;
  justify-content: center; gap: 14px; }
#hero .big svg { width: 52px; height: 52px; }
#hero .sub { margin: 6px 0 22px; }
#hero .tip { color: var(--faint); font-size: 12px; max-width: 460px; margin: 0 auto; }
.msg { margin: 0 0 18px; }
/* Your message, drawn like the terminal app draws it: a panel across the width with the accent bar on the left. */
.msg.user { margin: 4px 0 18px; display: flex; }
.user .bar { flex: none; color: var(--accent); background: var(--bg); position: relative; }
.user .bar::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); }
.user .body { flex: 1; min-width: 0; background: var(--panel); color: var(--text); padding: 1.55em 2ch;
  white-space: pre-wrap; overflow-wrap: anywhere; }
.user .imgs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.user .imgs:empty { display: none; }
.user img { display: block; max-width: 200px; max-height: 150px; border: 1px solid var(--line); }
.reply { padding: 0 2px; word-wrap: break-word; position: relative; }
.reply p { margin: 0 0 10px; }
.reply h1, .reply h2, .reply h3, .reply h4 { margin: 14px 0 8px; font-size: 15px; color: var(--accent); }
.reply ul, .reply ol { margin: 0 0 10px; padding-left: 22px; }
.reply code { background: var(--panel2); padding: 1px 5px; border-radius: 4px; color: var(--cyan); }
.reply pre { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px;
  overflow-x: auto; margin: 0 0 10px; position: relative; }
.reply pre code { background: none; padding: 0; color: var(--text); }
.reply blockquote { margin: 0 0 10px; padding-left: 12px; border-left: 2px solid var(--border); color: var(--muted); }
.reply table { border-collapse: collapse; margin: 0 0 10px; display: block; overflow-x: auto; }
.reply td, .reply th { border: 1px solid var(--line); padding: 4px 8px; }
.copy { position: absolute; top: 6px; right: 6px; padding: 1px 7px; font-size: 11px; opacity: 0; transition: opacity .1s; }
.reply pre:hover .copy, .copy:focus { opacity: 1; }
details.tool { margin: 0 0 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
details.tool summary { padding: 6px 10px; cursor: pointer; color: var(--muted); list-style: none; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
details.tool summary::-webkit-details-marker { display: none; }
details.tool summary b { color: var(--accent2); font-weight: 400; }
details.tool summary .st { margin-right: 6px; }
details.tool.err summary .st { color: var(--error); }
details.tool.ok summary .st { color: var(--success); }
details.tool pre { margin: 0; padding: 8px 10px; border-top: 1px solid var(--line); max-height: 320px; overflow: auto;
  white-space: pre-wrap; word-wrap: break-word; color: var(--muted); font-size: 12.5px; }
.meta { color: var(--faint); font-size: 12px; margin: -6px 0 18px; }
.meta .mark { color: var(--accent2); }
.error { color: var(--error); }
.screen, .term { white-space: pre-wrap; word-wrap: break-word; color: var(--muted); }
.term { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px;
  font-size: 13px; overflow-x: auto; }
.term:empty::before { content: "…"; color: var(--faint); }
.term .b { font-weight: 700; } .term .d { opacity: .6; } .term .it { font-style: italic; } .term .u { text-decoration: underline; }

/* --- panels (the sidebar's tools) --- */
#panel { flex: 1; overflow-y: auto; padding: 8px max(16px, calc((100% - 860px) / 2)) 24px; }
#panel h2 { margin: 6px 0 2px; font-size: 18px; color: var(--text); display: flex; align-items: center; gap: 10px; }
#panel h2 svg.i { width: 20px; height: 20px; color: var(--accent); }
#panel .desc { color: var(--muted); margin: 0 0 14px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; align-items: center; }
.actions form { display: flex; gap: 6px; flex: 1 1 320px; }
.actions form input { flex: 1; min-width: 0; }
.results .hit { display: block; width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 8px 12px; margin: 0 0 8px; }
.results .hit:hover { border-color: var(--border); }
.results .hit .t { color: var(--text); }
.results .hit .s { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.results .hit mark { background: none; color: var(--warning); }
.themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.swatch { text-align: left; padding: 10px; border-radius: 8px; }
.swatch.on { box-shadow: 0 0 0 2px var(--accent); }
.swatch .dots { display: flex; gap: 4px; margin-top: 8px; }
.swatch .dots i { width: 14px; height: 14px; border-radius: 50%; display: block; }

/* --- composer --- */
#composer { padding: 6px max(16px, calc((100% - 860px) / 2)) max(16px, env(safe-area-inset-bottom)); position: relative; }
#status { color: var(--faint); font-size: 12px; min-height: 18px; padding: 0 4px 4px; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; }
#status .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent2);
  margin-right: 6px; animation: pulse 1s infinite alternate; }
@keyframes pulse { from { opacity: .3; } to { opacity: 1; } }
#box { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; }
#box:focus-within { border-color: var(--border); }
#box.plan { border-color: var(--warning); }
#box.drop { border-style: dashed; border-color: var(--accent); }
#input { background: transparent; color: var(--text); border: 0; outline: 0; resize: none; font: inherit; padding: 12px 14px 6px;
  min-height: 44px; max-height: 40vh; }
#chips { display: flex; gap: 8px; padding: 0 12px; flex-wrap: wrap; }
#chips:empty { display: none; }
.chip { position: relative; }
.chip img { width: 54px; height: 54px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); display: block; }
.chip .file { height: 54px; max-width: 180px; display: flex; align-items: center; gap: 6px; padding: 0 10px;
  border: 1px solid var(--line); border-radius: 6px; background: var(--panel2); color: var(--muted); font-size: 12px; }
.chip .file span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.att { color: var(--accent2); font-size: 13px; }
.chip button { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; padding: 0; border-radius: 50%;
  font-size: 11px; line-height: 1; }
#bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px 10px; gap: 8px; }
#bar .l, #bar .r { display: flex; align-items: center; gap: 6px; min-width: 0; }
.icon { padding: 5px 7px; display: inline-flex; align-items: center; justify-content: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; background: none; border: 1px solid transparent;
  color: var(--muted); font-size: 12.5px; padding: 4px 8px; max-width: 240px; }
.pill:hover { color: var(--text); background: var(--panel2); border-color: var(--line); }
.pill .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
.seg button { border: 0; background: none; padding: 3px 10px; font-size: 12.5px; color: var(--muted); border-radius: 6px; }
.seg button.on { background: var(--panel2); color: var(--text); }
.seg button.on.plan { color: var(--warning); }
#send, #stop { flex: none; }
#send { width: 34px; height: 34px; padding: 0; border-radius: 9px; display: inline-flex; align-items: center;
  justify-content: center; background: var(--accent); color: var(--bg); border-color: var(--accent); }
#stop { width: 34px; height: 34px; padding: 0; border-radius: 9px; display: inline-flex; align-items: center;
  justify-content: center; }

/* --- menus: / commands, models, chat actions --- */
.pop { position: absolute; z-index: 20; background: var(--panel2); border: 1px solid var(--border); border-radius: 8px;
  box-shadow: 0 10px 30px rgba(0,0,0,.45); max-height: 320px; overflow-y: auto; padding: 4px; min-width: 220px; }
.pop[hidden] { display: none; }
.pop .item { display: flex; gap: 10px; align-items: baseline; width: 100%; text-align: left; background: none; border: 0;
  border-radius: 5px; padding: 5px 9px; }
.pop .item:hover, .pop .item.sel { background: var(--panel); }
.pop .item .n { color: var(--cyan); white-space: nowrap; }
.pop .item .d { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pop .item .on { color: var(--success); width: 10px; }
.pop .head { color: var(--faint); font-size: 11.5px; padding: 4px 9px; text-transform: uppercase; letter-spacing: .5px; }
#slash { left: max(16px, calc((100% - 860px) / 2)); right: max(16px, calc((100% - 860px) / 2)); bottom: calc(100% - 22px); }

/* --- toasts, like the terminal app's --- */
#toasts { position: fixed; top: 14px; right: 14px; z-index: 40; display: flex; flex-direction: column; gap: 8px;
  pointer-events: none; }
.toast { background: var(--panel2); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 6px;
  padding: 8px 12px; max-width: 340px; box-shadow: 0 8px 24px rgba(0,0,0,.4); animation: slide .15s ease-out; }
.toast.success { border-left-color: var(--success); } .toast.error { border-left-color: var(--error); }
.toast.warning { border-left-color: var(--warning); }
@keyframes slide { from { transform: translateX(20px); opacity: 0; } to { transform: none; opacity: 1; } }

#login { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: none; align-items: center;
  justify-content: center; padding: 16px; z-index: 50; }
#login form { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 22px;
  width: 100%; max-width: 440px; }
#login input { width: 100%; margin: 12px 0; }
#login p { color: var(--muted); margin: 6px 0 0; font-size: 13px; }

@media (max-width: 760px) {
  #side { position: fixed; inset: 0 auto 0 0; z-index: 30; transform: translateX(-100%); transition: transform .15s;
    width: 82vw; max-width: 320px; }
  body.menu #side { transform: none; box-shadow: 0 0 40px #000; }
  #top .menu { display: inline-flex; }
  #chat, #panel { padding-left: 16px; padding-right: 16px; }
  #composer { padding-left: 12px; padding-right: 12px; }
  #slash { left: 12px; right: 12px; }
  #think { display: none; }
  .pill { max-width: 130px; }
}
</style>
</head>

<aside id="side">
  <header><div class="logo"><svg aria-hidden="true"><use href="#logo"/></svg>nanocode</div></header>
  <nav id="nav">
    <button class="nav" id="newBtn" title="New chat (Ctrl+Shift+O)"><svg class="i"><use href="#i-plus"/></svg><span class="grow">New chat</span></button>

<div id="login"><form id="loginForm">
  <b>Connect to nanocode</b>
  <p>Paste the API key that <code>nanocode serve</code> printed (or from <code>~/.nanocode/config.json</code>, under
    "api"). It's kept in this browser only.</p>
  <input id="key" type="password" autocomplete="off" placeholder="API key" required>
  <button class="primary" type="submit">Connect</button> <span id="loginError" class="error"></span>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} },
};
const state = { key: null, session: null, title: "", run: null, busy: false, sessions: [], ws: null, mode: "build",
                images: [], panel: null, slash: [], slashSel: 0 };
const icon = (name) => '<svg class="i"><use href="#i-' + name + '"/></svg>';

// --- API ---
async function api(method, path, body) {
  const res = await fetch(path, { method, headers: { "Authorization": "Bearer " + state.key,
    "Content-Type": "application/json" }, body: body === undefined ? undefined : JSON.stringify(body) });
  if (res.status === 401) { askKey("That key didn't work."); throw new Error("unauthorized"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error((data.error && data.error.message) || res.statusText);
  return data;
}

// Server-sent events over fetch (EventSource can't send the Authorization header).
async function events(path, onEvent) {
  const res = await fetch(path, { headers: { "Authorization": "Bearer " + state.key } });
  if (!res.ok || !res.body) throw new Error("can't follow the run (" + res.status + ")");
  const reader = res.body.getReader(), decoder = new TextDecoder();
  let buffer = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    let cut;
    while ((cut = buffer.indexOf("\n\n")) >= 0) {
      const block = buffer.slice(0, cut); buffer = buffer.slice(cut + 2);
      const data = block.split("\n").filter((l) => l.startsWith("data: ")).map((l) => l.slice(6)).join("\n");
      if (data) { try { onEvent(JSON.parse(data)); } catch (e) { console.error(e); } }
    }
  }
}

// --- Markdown (small, safe: everything is escaped first) ---
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function inline(s) {
  const codes = [];
  s = s.replace(/`([^`\n]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
  s = esc(s)
    .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^\w*])\*([^*\n]+)\*(?=[^\w*]|$)/g, "$1<i>$2</i>")
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => "<code>" + esc(codes[+i]) + "</code>");
}
function markdown(src) {
  const lines = src.replace(/\r/g, "").split("\n"), out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    const fence = line.match(/^\s*(```|~~~)\s*([\w+-]*)/);
    if (fence) {
      const body = []; i++;
      while (i < lines.length && !lines[i].trim().startsWith(fence[1])) body.push(lines[i++]);
      i++;
      out.push('<pre><button class="copy" type="button">copy</button><code>' + esc(body.join("\n")) + "</code></pre>");
      continue;
    }
    const h = line.match(/^(#{1,4})\s+(.*)/);
    if (h) { out.push("<h" + h[1].length + ">" + inline(h[2]) + "</h" + h[1].length + ">"); i++; continue; }
    if (/^\s*([-*+]|\d+[.)])\s+/.test(line)) {
      const ordered = /^\s*\d/.test(line), items = [];
      while (i < lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i]))
        items.push("<li>" + inline(lines[i++].replace(/^\s*([-*+]|\d+[.)])\s+/, "")) + "</li>");
      out.push((ordered ? "<ol>" : "<ul>") + items.join("") + (ordered ? "</ol>" : "</ul>"));
      continue;
    }
    if (/^\s*\|.*\|\s*$/.test(line)) {
      const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(lines[i++]);
      out.push("<table>" + rows.filter((r) => !/^\s*\|[\s:|-]+\|\s*$/.test(r)).map((r, n) => "<tr>" +
        r.trim().slice(1, -1).split("|").map((c) => (n ? "<td>" : "<th>") + inline(c.trim()) + (n ? "</td>" : "</th>")).join("")
        + "</tr>").join("") + "</table>");
      continue;
    }
    if (/^>\s?/.test(line)) {
      const q = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) q.push(lines[i++].replace(/^>\s?/, ""));
      out.push("<blockquote>" + inline(q.join(" ")) + "</blockquote>");
      continue;
    }
    if (!line.trim()) { i++; continue; }
    const para = [];
    while (i < lines.length && lines[i].trim() && !/^\s*(```|~~~|#{1,4}\s|[-*+]\s|\d+[.)]\s|>|\|)/.test(lines[i])) para.push(lines[i++]);
    if (!para.length) para.push(lines[i++]);
    out.push("<p>" + para.map(inline).join("<br>") + "</p>");
  }
  return out.join("");
}

// --- Terminal output of commands (ANSI colors -> HTML) ---
const ANSI16 = ["#000000", "var(--error)", "var(--success)", "var(--warning)", "var(--accent)", "var(--accent2)",
                "var(--cyan)", "var(--text)"];
function ansi(text) {
  text = String(text).replace(/\x1b\][^\x07\x1b]*(\x07|\x1b\\)/g, "").replace(/\x1b\[[0-9;?]*[A-LN-Za-ln-z]/g, "");
  let html = "", open = false;
  const st = { b: false, d: false, it: false, u: false, color: null };
  const flush = () => {
    if (open) html += "</span>";
    const cls = ["b", "d", "it", "u"].filter((k) => st[k]).join(" ");
    open = !!(cls || st.color);
    if (open) html += '<span' + (cls ? ' class="' + cls + '"' : "") + (st.color ? ' style="color:' + st.color + '"' : "") + ">";
  };
  for (const part of text.split(/(\x1b\[[0-9;]*m)/)) {
    const m = part.match(/^\x1b\[([0-9;]*)m$/);
    if (!m) { html += esc(part); continue; }
    const codes = m[1] === "" ? [0] : m[1].split(";").map(Number);
    for (let i = 0; i < codes.length; i++) {
      const c = codes[i];
      if (c === 0) Object.assign(st, { b: false, d: false, it: false, u: false, color: null });
      else if (c === 1) st.b = true; else if (c === 2) st.d = true; else if (c === 3) st.it = true;
      else if (c === 4) st.u = true; else if (c === 22) st.b = st.d = false; else if (c === 23) st.it = false;
      else if (c === 24) st.u = false; else if (c === 39) st.color = null;
      else if (c >= 30 && c <= 37) st.color = ANSI16[c - 30];
      else if (c >= 90 && c <= 97) st.color = ANSI16[c - 90];
      else if ((c === 38 || c === 48) && codes[i + 1] === 2) {
        if (c === 38) st.color = "rgb(" + codes.slice(i + 2, i + 5).join(",") + ")";
        i += 4;
      } else if ((c === 38 || c === 48) && codes[i + 1] === 5) { i += 2; }
    }
    flush();
  }
  return html + (open ? "</span>" : "");
}

// --- Rendering ---
const chat = $("chat");
function stick() { return chat.scrollHeight - chat.scrollTop - chat.clientHeight < 80; }
function bottom() { chat.scrollTop = chat.scrollHeight; }
function hero() {
  const ws = state.ws || {};
  chat.innerHTML = '<div id="hero"><div class="big"><svg aria-hidden="true"><use href="#logo"/></svg>nanocode</div><div class="sub">' +
    esc(ws.folder ? "Working in " + ws.folder : "A small coding agent") + '</div><div class="tip">' +
    "Ask anything about this project. Type / for commands, attach or paste images, and switch Plan/Build " +
    "below. Edits and commands run on the machine running <code>nanocode serve</code>.</div></div>";
}
function add(cls, html) {
  $("hero") && $("hero").remove();
  const el = document.createElement("div");
  el.className = "msg " + cls; el.innerHTML = html; chat.appendChild(el); return el;
}
// A message as sent can hold attached files (<file path="…">content</file>): shown as one line each.
function splitFiles(text) {
  const files = [];
  text = String(text || "").replace(/\n*<file path="([^"]*)"[^>]*>[\s\S]*?<\/file>/g, (_, p) => { files.push(p); return ""; });
  return { text: text.trim(), files };
}
function userMsg(raw, images) {
  const { text, files } = splitFiles(raw);
  const el = add("user", '<div class="bar"></div><div class="body"><div class="text"></div><div class="imgs"></div></div>');
  el.querySelector(".text").textContent = text;
  for (const f of files) {
    const line = document.createElement("div");
    line.className = "att"; line.textContent = "📎 " + f.split("/").pop().replace(/^\d{8}-\d{6}-(\d+-)?/, "");
    line.title = f;
    el.querySelector(".body").insertBefore(line, el.querySelector(".imgs"));
  }
  for (const src of images || []) { const img = document.createElement("img"); img.src = src; el.querySelector(".imgs").appendChild(img); }
  if (!text) el.querySelector(".text").remove();
  return el;
}
function toolEl(name, args) {
  $("hero") && $("hero").remove();
  const d = document.createElement("details");
  d.className = "tool";
  const preview = args && typeof args === "object" ? (args.path || args.command || args.pattern || args.query ||
    args.url || args.name || "") : "";
  d.innerHTML = '<summary><span class="st">⚙</span><b>' + esc(name) + "</b> " + esc(String(preview).slice(0, 140)) +
    "</summary><pre>" + esc(JSON.stringify(args || {}, null, 1)) + "</pre>";
  chat.appendChild(d);
  return d;
}
function toolDone(d, output, isError) {
  d.classList.add(isError ? "err" : "ok");
  d.querySelector(".st").textContent = isError ? "✗" : "✓";
  const pre = document.createElement("pre");
  pre.textContent = output || "";
  d.appendChild(pre);
}
function fmtTokens(n) { return n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + "k" : String(n); }
function status(text, busy) { $("status").innerHTML = (busy ? '<span class="dot"></span>' : "") + esc(text || ""); }
function toast(text, variant) {
  const el = document.createElement("div");
  el.className = "toast " + (variant || "");
  el.textContent = text;
  $("toasts").appendChild(el);
  setTimeout(() => el.remove(), 3200);
}
function setTitle(t) { state.title = t || ""; $("title").textContent = t || "New chat"; document.title = t ? t + " · nanocode" : "nanocode"; }

// --- Workspace: model, thinking, mode, themes, commands ---
async function loadWorkspace() {
  try { state.ws = await api("GET", "/v1/workspace"); } catch (e) { return; }
  const ws = state.ws;
  $("modelName").textContent = ws.model || "model";
  $("thinkName").textContent = "think: " + ws.think;
  $("where").textContent = ws.folder + " · v" + ws.version;
  $("where").title = ws.provider_label + " · edits and commands: " + (ws.permissions === "auto" ? "allowed" : "read-only");
  if (!state.session && !state.busy) setMode(ws.mode, true);
  applyTheme(store.get("nanocode.theme") || ws.theme, false);
  if ($("hero")) hero();
}
function setMode(mode, quiet) {
  state.mode = mode === "plan" ? "plan" : "build";
  for (const b of $("mode").children) b.classList.toggle("on", b.dataset.mode === state.mode);
  $("mode").querySelector('[data-mode="plan"]').classList.add("plan");
  $("box").classList.toggle("plan", state.mode === "plan");
  if (!quiet) toast(state.mode === "plan" ? "Plan mode: the model explores and plans, no edits"
                                          : "Build mode: the model edits files and runs commands", state.mode === "plan" ? "warning" : "success");
}
const THEME_VARS = { bg: "--bg", panel: "--panel", panel2: "--panel2", border: "--border", text: "--text", muted: "--muted",
                     faint: "--faint", accent: "--accent", accent2: "--accent2", cyan: "--cyan", success: "--success",
                     error: "--error", warning: "--warning" };
function applyTheme(name, save) {
  const themes = (state.ws && state.ws.themes) || {};
  const t = themes[name];
  if (!t) return;
  const root = document.documentElement.style;
  for (const [k, v] of Object.entries(THEME_VARS)) if (t[k]) root.setProperty(v, t[k]);
  root.setProperty("--line", t.panel2 || t.border);
  document.querySelector('meta[name="theme-color"]').content = t.bg;
  state.theme = name;
  if (save) store.set("nanocode.theme", name);
}

// --- Sessions ---
async function loadSessions() {
  try {
    const data = await api("GET", "/v1/sessions");
    state.sessions = data.data || [];
  } catch (e) { return; }
  const list = $("sessions");
  list.innerHTML = state.sessions.length ? "" : '<div class="empty-note">no chats yet</div>';
  for (const s of state.sessions) {
    const b = document.createElement("div");
    b.className = "session" + (s.id === state.session && !state.panel ? " active" : "");
    b.tabIndex = 0;
    b.innerHTML = '<span class="t"></span><span class="m"></span><button class="more" title="Fork, export">⋯</button>';
    b.querySelector(".t").textContent = s.title || "untitled";
    b.querySelector(".m").textContent = ago(s.updated) + (s.model ? " · " + s.model : "");
    b.onclick = () => { openSession(s.id); document.body.classList.remove("menu"); };
    b.onkeydown = (e) => { if (e.key === "Enter") b.onclick(); };
    b.oncontextmenu = (e) => { e.preventDefault(); chatMenu(s, e.clientX, e.clientY); };
    b.querySelector(".more").onclick = (e) => { e.stopPropagation(); const r = e.target.getBoundingClientRect(); chatMenu(s, r.left, r.bottom); };
    list.appendChild(b);
  }
}
function ago(ts) {
  const s = Date.now() / 1000 - (ts || 0);
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return Math.floor(s / 86400) + "d ago";
}
function showChat() {
  state.panel = null;
  $("panel").hidden = true; $("chat").hidden = false;
  for (const n of document.querySelectorAll(".nav[data-panel]")) n.classList.remove("active");
}
async function openSession(id, quiet) {
  if (state.busy) { toast("Wait for the reply to finish (or stop it)", "warning"); return; }
  let data;
  status("opening…", true);
  try { data = await api("GET", "/v1/sessions/" + encodeURIComponent(id)); }
  catch (e) { status(""); if (!quiet) toast(e.message, "error"); else store.set("nanocode.session", null); return; }
  showChat();
  state.session = id;
  store.set("nanocode.session", id);
  chat.innerHTML = "";
  const tools = {};
  for (const t of data.turns || []) {
    if (t.role === "user") userMsg(t.text);
    else if (t.role === "assistant") add("reply", markdown(t.text));
    else if (t.role === "tool") tools[t.id] = toolEl(t.name, t.arguments);
    else if (t.role === "tool_result" && tools[t.id]) toolDone(tools[t.id], t.text, t.is_error);
    else if (t.role === "screen") { const el = add("screen", ""); el.innerHTML = ansi(t.text); }
  }
  setTitle(data.title || (data.run ? splitFiles(data.run.prompt).text.slice(0, 60) : ""));
  status("");
  loadSessions();
  if (data.run) {                    // a reply still being written: show it and follow it to the end
    userMsg(data.run.prompt);
    bottom();
    followRun(data.run.id, data.run.prompt);
    return;
  }
  if (!chat.children.length) hero();
  bottom();
}
function newChat() {
  if (state.busy) { toast("Wait for the reply to finish (or stop it)", "warning"); return; }
  showChat();
  state.session = null;
  store.set("nanocode.session", null);
  setTitle("");
  hero();
  status("");
  loadSessions();
  $("input").focus();
  document.body.classList.remove("menu");
}
async function forkChat(id) {
  if (!id) { toast("Nothing to fork yet: send a message first", "warning"); return; }
  if (state.busy) { toast("Wait for the reply to finish (or stop it)", "warning"); return; }
  try {
    const fork = await api("POST", "/v1/sessions/" + encodeURIComponent(id) + "/fork", {});
    toast("Forked: " + fork.title, "success");
    await openSession(fork.id);
  } catch (e) { toast(e.message, "error"); }
}
async function exportChat(id, format) {
  if (!id) { toast("Nothing to export yet: send a message first", "warning"); return; }
  try {
    const data = await api("GET", "/v1/sessions/" + encodeURIComponent(id) + "/export?format=" + format);
    const url = URL.createObjectURL(new Blob([data.content], { type: format === "json" ? "application/json" : "text/markdown" }));
    const a = document.createElement("a");
    a.href = url; a.download = data.filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast("Exported " + data.filename + (format === "json" ? " (the whole chat, tool output included)" : ""), "success");
  } catch (e) { toast(e.message, "error"); }
}

// --- Small menus (chat actions, model, thinking) ---
function popMenu(items, x, y) {
  const pop = $("menuPop");
  pop.innerHTML = "";
  for (const it of items) {
    if (it.head) { const h = document.createElement("div"); h.className = "head"; h.textContent = it.head; pop.appendChild(h); continue; }
    const b = document.createElement("button");
    b.className = "item";
    b.innerHTML = '<span class="on">' + (it.on ? "●" : "") + '</span><span class="n"></span><span class="d"></span>';
    b.querySelector(".n").textContent = it.label;
    b.querySelector(".d").textContent = it.desc || "";
    b.onclick = () => { closePop(); it.run(); };
    pop.appendChild(b);
  }
  pop.hidden = false;
  const w = pop.offsetWidth, h = pop.offsetHeight;
  pop.style.left = Math.max(8, Math.min(x, innerWidth - w - 8)) + "px";
  pop.style.top = Math.max(8, Math.min(y, innerHeight - h - 8)) + "px";
}
function closePop() { $("menuPop").hidden = true; }
function chatMenu(s, x, y) {
  popMenu([
    { label: "Open", run: () => openSession(s.id) },
    { label: "Fork", desc: "a copy to try another direction", run: () => forkChat(s.id) },
    { label: "Export Markdown", run: () => exportChat(s.id, "md") },
    { label: "Export JSON", desc: "the whole chat", run: () => exportChat(s.id, "json") },
  ], x, y);
}
function aboveRect(el) { const r = el.getBoundingClientRect(); return [r.left, r.top]; }
function modelMenu() {
  const ws = state.ws;
  if (!ws) return;
  const items = [{ head: ws.provider_label }].concat(ws.models.map((m) => ({ label: m.id, desc: m.description,
    on: m.id === ws.model, run: () => command("/model " + m.id, { quiet: true, done: () => toast("Model: " + m.id, "success") }) })));
  if (!ws.models.some((m) => m.id === ws.model)) items.splice(1, 0, { label: ws.model, desc: "current", on: true, run: () => {} });
  const [x, y] = aboveRect($("modelBtn"));
  popMenu(items, x, y - Math.min(330, 28 * items.length + 10));
}
function thinkMenu() {
  const ws = state.ws;
  if (!ws) return;
  const help = { off: "answer right away", low: "a little thinking", medium: "the default", high: "think hard (slower)" };
  const items = ws.think_levels.map((l) => ({ label: l, desc: help[l] || "", on: l === ws.think,
    run: () => command("/think " + l, { quiet: true, done: () => toast("Thinking: " + l, "success") }) }));
  const [x, y] = aboveRect($("think"));
  popMenu(items, x, y - (28 * items.length + 10));
}

// --- Images ---
// Attachments: images go to the model as images; any other file is saved on the server and given to the model
// (a text file's content is attached, like @file in the terminal).
function addImages(files) {
  for (const f of files) {
    const image = /^image\/(png|jpeg|webp|gif)$/.test(f.type);
    const limit = image ? 20 : 25;

// --- Commands: / in the box, and every tool panel ---
const CONFIRM = { "/undo": "Undo the last turn's file changes?", "/redo": "Put back what /undo reverted?",
                  "/rollback": "Restore the project's files to before that turn?" };
function needsConfirm(text) {
  const [word, ...rest] = text.trim().split(/\s+/);
  if (word === "/rollback" && !rest.length) return null;
  return CONFIRM[word] || null;
}
// Runs a slash command on the server; its terminal output streams into `into` (or into the chat).
async function command(text, opts) {
  opts = opts || {};
  const question = needsConfirm(text);
  if (question && !confirm(question)) return;
  if (state.busy && !opts.panel) { toast("Wait for the reply to finish (or stop it)", "warning"); return; }
  const target = opts.into || (opts.quiet ? null : add("term", ""));
  const own = !opts.panel && !opts.quiet;
  if (own) { setBusy(true); status(text.split(" ")[0] + "…", true); }
  let output = "", runTools = {}, reply = null, source = "", failed = null;
  try {
    const started = await api("POST", "/v1/runs", { input: text, command: true, confirmed: !!question,
      session_id: opts.panel || opts.quiet ? undefined : state.session || undefined,
      mode: opts.panel || opts.quiet ? undefined : state.mode });
    if (own) state.run = started.run_id;
    await events("/v1/runs/" + started.run_id + "/events", (ev) => {
      const follow = stick();
      if (ev.event === "run.started" && own && !state.session) { state.session = ev.session_id; store.set("nanocode.session", ev.session_id); }
      else if (ev.event === "output") { output += ev.text; if (target) target.innerHTML = ansi(output.replace(/\n+$/, "")); }
      else if (ev.event === "delta" && !opts.panel) {          // a command that starts a turn: /compact, a skill...
        if (!reply) { reply = add("reply", ""); source = ""; }
        source += ev.text; reply.innerHTML = markdown(source); status("writing…", true);
      } else if (ev.event === "text_end") reply = null;
      else if (ev.event === "tool.started" && !opts.panel) { reply = null; runTools[ev.id] = toolEl(ev.name, ev.arguments); status(ev.name + "…", true); }
      else if (ev.event === "tool.completed" && runTools[ev.id]) toolDone(runTools[ev.id], ev.output, ev.is_error);
      else if (ev.event === "run.failed") failed = ev.error;
      if (follow && !opts.panel) bottom();
    });
  } catch (e) {
    failed = e.message;
  } finally {
    if (own) { state.run = null; setBusy(false); status(""); }
  }
  if (failed && failed !== "unauthorized") {
    if (target) target.innerHTML = (output ? ansi(output) + "\n" : "") + '<span class="error">⏺ ' + esc(failed) + "</span>";
    else toast(failed, "error");
  } else if (target && !output.trim()) target.remove();
  if (!failed && opts.done) opts.done(output);
  if (!opts.panel) { if (!opts.quiet) bottom(); loadSessions(); }
  if (/^\/(model|think|plan|build)\b/.test(text)) loadWorkspace();
  return output;
}

function updateSlash() {
  const input = $("input"), v = input.value;
  const pop = $("slash");
  if (!state.ws || !v.startsWith("/") || /\s/.test(v)) { pop.hidden = true; state.slash = []; return; }

  const local = [{ name: "/new", description: "new chat" }, { name: "/search", description: "search your chats: /search <words>" },

                 { name: "/export", description: "download this chat: /export [md|json]" },

    all.filter((c) => !c.name.slice(1).toLowerCase().startsWith(q) && c.name.toLowerCase().includes(q))).slice(0, 40);
  state.slashSel = Math.min(state.slashSel, Math.max(0, state.slash.length - 1));

async function submit() {
  const input = $("input"), text = input.value.trim();
  if ((!text && !state.images.length) || state.busy) return;
  $("slash").hidden = true;
  if (/^[\/#]/.test(text) && !state.images.length) {
    const [word, ...rest] = text.split(/\s+/), arg = rest.join(" ");
    const local = {
      "/new": newChat, "/c": newChat, "/clear": newChat,
      "/search": () => openPanel("search", arg), "/fork": () => forkChat(state.session),
      "/export": () => exportChat(state.session, /json/i.test(arg) ? "json" : "md"),
      "/theme": () => { if (arg && state.ws && state.ws.themes[arg]) { applyTheme(arg, true); toast("Theme: " + arg, "success"); } else openPanel("theme"); },
    };
    if (local[word]) { input.value = ""; resize(); local[word](); return; }
    if (word === "/plan" && !arg) { input.value = ""; setMode("plan"); return; }
    if (word === "/build" && !arg) { input.value = ""; setMode("build"); return; }
    input.value = ""; resize();
    showChat();
    if (word === "/plan" || word === "/build") setMode(word.slice(1), true);
    userMsg(text); bottom();
    await command(text);
    return;
  }
  input.value = ""; resize();
  showChat();
  try { if ("Notification" in window && Notification.permission === "default") Notification.requestPermission(); } catch (e) {}
  const attached = state.images.splice(0);
  chips();
  const imgs = attached.filter((a) => a.image), files = attached.filter((a) => !a.image);
  userMsg(text + files.map((f) => '\n<file path="' + f.name + '"></file>').join(""), imgs.map((a) => a.data)); bottom();
  const body = attached.length
    ? { input: [{ role: "user", content: [{ type: "input_text", text: text }]
        .concat(imgs.map((a) => ({ type: "input_image", image_url: a.data })))
        .concat(files.map((a) => ({ type: "input_file", filename: a.name, file_data: a.data }))) }] }
    : { input: text };
  body.session_id = state.session || undefined;
  body.mode = state.mode;
  setBusy(true);
  status("sending…", true);
  let runId;
  try {
    runId = (await api("POST", "/v1/runs", body)).run_id;
  } catch (e) {
    setBusy(false); status("");
    if (e.message !== "unauthorized") add("error", esc("⏺ " + e.message));
    return;
  }
  await followRun(runId, text);
}

// Shows a turn as it happens: the reply, tool calls, then tokens and cost. Also picks up a turn that was already
// running (the page was reloaded mid-reply): its events so far come first.
async function followRun(runId, text) {
  setBusy(true);
  status("thinking…", true);
  let reply = null, source = "";
  const runTools = {};
  try {
    state.run = runId;
    await events("/v1/runs/" + runId + "/events", (ev) => {
      const follow = stick();
      if (ev.event === "run.started") {
        state.session = ev.session_id; store.set("nanocode.session", ev.session_id);
        if (!state.title) setTitle(splitFiles(text).text.slice(0, 60));
      } else if (ev.event === "delta") {
        if (!reply) { reply = add("reply", ""); source = ""; }
        source += ev.text; reply.innerHTML = markdown(source);
        status("writing…", true);
      } else if (ev.event === "text_end") {
        reply = null;
      } else if (ev.event === "tool.started") {
        reply = null;
        runTools[ev.id] = toolEl(ev.name, ev.arguments);
        status(ev.name + "…", true);
      } else if (ev.event === "tool.completed") {
        if (runTools[ev.id]) toolDone(runTools[ev.id], ev.output, ev.is_error);
        status("thinking…", true);
      } else if (ev.event === "run.completed" || ev.event === "run.failed" || ev.event === "run.cancelled") {
        const u = ev.usage || {};
        const parts = [];
        if (ev.event === "run.cancelled") parts.push("stopped");
        if (state.mode === "plan") parts.push("plan");
        if (u.input_tokens) parts.push(fmtTokens(u.input_tokens) + " in · " + fmtTokens(u.output_tokens) + " out");
        if (u.cost) parts.push("$" + u.cost.toFixed(4));
        if (parts.length) add("meta", '<span class="mark">▣</span> ' + esc(parts.join(" · ")));
        if (ev.error) add("error", esc("⏺ " + ev.error));
      }
      if (follow) bottom();
    });
  } catch (e) {
    if (e.message !== "unauthorized") add("error", esc("⏺ " + e.message));
  } finally {
    state.run = null;
    setBusy(false);
    status("");
    bottom();
    loadSessions();
    if (document.hidden) notify("nanocode", "The reply is ready");
  }
}
function notify(title, body) {

chat.addEventListener("click", (e) => {
  document.body.classList.remove("menu");
  if (e.target.classList.contains("copy")) {
    const code = e.target.parentNode.querySelector("code");
    navigator.clipboard.writeText(code ? code.textContent : "").then(() => toast("Copied", "success"), () => toast("Can't copy here", "error"));
  }
});
document.addEventListener("click", (e) => { if (!$("menuPop").contains(e.target)) closePop(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closePop();
  if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "o") { e.preventDefault(); newChat(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openPanel("search"); }
});
buildNav();

// `nanocode web` opens this page with the key in the address's #fragment (never sent to the server).
const fromHash = new URLSearchParams(location.hash.slice(1)).get("key");
if (fromHash) history.replaceState(null, "", location.pathname);
const saved = fromHash || store.get("nanocode.key");
if (saved) connect(saved); else askKey("");
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
