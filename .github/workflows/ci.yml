name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt pytest pyflakes
      - run: python -m pyflakes nanocode.py tests
      - run: python -m pytest -q tests

  install-unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: shellcheck -s sh install.sh
        if: runner.os == 'Linux'
      - run: sh install.sh
      - run: ~/.nanocode/bin/nanocode --version
      - run: ~/.nanocode/bin/nanocode doctor
      - run: test -f ~/.nanocode/tools/rea/runtime.json && ~/.nanocode/bin/nanocode doctor | grep -q "REA"
      - run: sh install.sh --uninstall --purge && test ! -e ~/.nanocode
      - name: REA with a private Node.js (official LTS in ~/.nanocode/node)
        run: |
          NANOCODE_PRIVATE_NODE=1 sh install.sh
          grep -q "$HOME/.nanocode/node/bin/node" ~/.nanocode/tools/rea/runtime.json
          ~/.nanocode/bin/nanocode doctor | grep -q "REA"
          sh install.sh --uninstall --purge && test ! -e ~/.nanocode
      - name: install without a system Python (uv-managed Python in ~/.nanocode/python)
        run: |
          NANOCODE_MANAGED_PYTHON=1 sh install.sh --no-rea
          ~/.nanocode/bin/nanocode --version
          grep -q "$HOME/.nanocode/python" ~/.nanocode/venv/pyvenv.cfg
          sh install.sh --uninstall --purge && test ! -e ~/.nanocode

  install-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - shell: pwsh
        run: ./install.ps1
      - shell: pwsh
        run: |
          & "$env:USERPROFILE\.nanocode\bin\nanocode.cmd" --version
          if (-not (Test-Path "$env:USERPROFILE\.nanocode\tools\rea\runtime.json")) { exit 1 }
          & "$env:USERPROFILE\.nanocode\bin\nanocode.cmd" doctor
      - shell: pwsh
        run: |
          ./install.ps1 -Uninstall -Purge
          if (Test-Path "$env:USERPROFILE\.nanocode") { exit 1 }
      - name: REA with a private Node.js (official LTS in .nanocode\node)
        shell: pwsh
        run: |
          $env:NANOCODE_PRIVATE_NODE = "1"
          ./install.ps1
          if (-not (Select-String -Quiet -Path "$env:USERPROFILE\.nanocode\tools\rea\runtime.json" -Pattern "nanocode\\\\node")) { exit 1 }
          ./install.ps1 -Uninstall -Purge
          if (Test-Path "$env:USERPROFILE\.nanocode") { exit 1 }
      - name: install without a system Python (uv-managed Python in .nanocode\python)
        shell: pwsh
        run: |
          $env:NANOCODE_MANAGED_PYTHON = "1"
          ./install.ps1 -NoRea
          & "$env:USERPROFILE\.nanocode\bin\nanocode.cmd" --version
          if (-not (Select-String -Quiet -Path "$env:USERPROFILE\.nanocode\venv\pyvenv.cfg" -Pattern "\.nanocode\\python")) { exit 1 }
          ./install.ps1 -Uninstall -Purge
          if (Test-Path "$env:USERPROFILE\.nanocode") { exit 1 }
